name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          # A CI package's version follows its app's tags.
          fetch-depth: 0

      - uses: ./.github/actions/build

      - name: Test the build scripts
        shell: pwsh
        run: Invoke-Pester -Path build/tests -CI

      # NativeAOT and trimming warnings only surface at publish time, and they are errors here. Every app is packaged as
      # its release would be, so a shared change cannot break one that nobody was looking at. CI packages carry the CI
      # channel's key, never a release's; a pull request from a fork gets no secrets and builds without one.
      - name: Package every app
        shell: pwsh
        env:
          MANAGER_API_KEY: ${{ secrets.MANAGER_API_KEY_CI }}
        run: |
          foreach ($app in (Get-ChildItem src/*/Product.props).Directory.Name) {
            ./build/package.ps1 -App $app -Version (./build/version.ps1 -App $app -Ci ${{ github.run_number }}) -NoDelta
          }

      - name: Keep the installers
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/release/*/releases/
          retention-days: 7
          if-no-files-found: error
