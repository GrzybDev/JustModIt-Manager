name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  checks:
    uses: GrzybDev/actions/.github/workflows/dotnet-checks.yml@v1
    with:
      solution: JustModIt.Manager.slnx
      # The native shims build from them; dav1d, which the AVIF shim holds, builds with meson and its assembly with nasm.
      submodules: true
      apt-packages: meson nasm

  package:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 has glibc 2.35, the oldest the Linux release runs on: NativeAOT binds to the builder's glibc.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          # A CI package's version follows its app's tags.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # vpk builds the AppImage's file system with mksquashfs; meson and nasm build dav1d for the AVIF shim.
      - name: Install the Linux build and packaging tools
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools meson nasm

      - name: Test the build scripts
        shell: pwsh
        run: Invoke-Pester -Path build/tests -CI

      - uses: actions/setup-node@v7
        if: ${{ runner.os == 'Windows' }}
        with:
          node-version: 26

      - name: Test the Steam scripts
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: node --test "steam/**/*.test.mjs"

      # NativeAOT and trimming warnings only surface at publish time, and they are errors here. Every app is packaged as
      # its release would be, so a shared change cannot break one that nobody was looking at. CI packages carry the CI
      # channel's key, never a release's; a pull request from a fork gets no secrets and builds without one.
      - name: Package every app
        shell: pwsh
        env:
          MANAGER_API_KEY: ${{ secrets.MANAGER_API_KEY_CI }}
        run: |
          foreach ($app in (Get-ChildItem src/*/Product.props).Directory.Name) {
            ./build/package.ps1 -App $app -Version (./build/version.ps1 -App $app -Ci ${{ github.run_number }}) -NoDelta
          }

      - name: Keep the installers
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ runner.os }}
          path: artifacts/release/*/releases/
          retention-days: 7
          if-no-files-found: error
